<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>3D Flight Simulator</title>
    <style>
        body, html { margin:0; padding:0; overflow:hidden; width:100%; height:100%; font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif; user-select:none; -webkit-user-select:none; background-color:#000; }
        #canvas-container { width:100%; height:100%; position:absolute; top:0; left:0; z-index:1; }
        .ui-panel { position:absolute; z-index:10; color:white; text-shadow:2px 2px 4px rgba(0,0,0,.8); pointer-events:none; }
        #hud-top { top:15px; left:15px; font-size:18px; font-weight:bold; background:rgba(0,0,0,.4); padding:10px 15px; border-radius:8px; border-left:4px solid #00ffcc; }
        #hud-center-msg { top:30%; left:50%; transform:translate(-50%,-50%); font-size:28px; font-weight:bold; text-align:center; color:#ffff00; display:none; background:rgba(0,0,0,.6); padding:15px 30px; border-radius:10px; animation:pulse 1.5s infinite; }
        @keyframes pulse { 0%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-50%,-50%) scale(1.05)} 100%{transform:translate(-50%,-50%) scale(1)} }
        .touch-container { position:absolute; bottom:20px; z-index:20; display:flex; justify-content:space-between; width:100%; padding:0 20px; box-sizing:border-box; pointer-events:none; }
        .control-group { display:flex; gap:15px; pointer-events:auto; }
        .btn-touch { width:70px; height:70px; background:rgba(255,255,255,.2); border:2px solid rgba(255,255,255,.6); border-radius:50%; color:white; font-size:24px; font-weight:bold; display:flex; align-items:center; justify-content:center; backdrop-filter:blur(5px); touch-action:manipulation; }
        .btn-touch:active { background:rgba(0,255,200,.5); border-color:#00ffcc; transform:scale(.95); }
        .vertical-controls { flex-direction:column; }
        .throttle-container { display:flex; flex-direction:column; align-items:center; background:rgba(0,0,0,.5); padding:10px; border-radius:10px; border:1px solid rgba(255,255,255,.2); }
        .throttle-label { color:white; font-size:12px; margin-bottom:5px; font-weight:bold; }
        #menu-overlay { position:absolute; top:0; left:0; width:100%; height:100%; background:linear-gradient(135deg,rgba(15,32,67,.95) 0%,rgba(27,49,85,.95) 100%); z-index:100; display:flex; flex-direction:column; align-items:center; justify-content:center; color:white; padding:20px; box-sizing:border-box; }
        #menu-overlay h1 { margin-top:0; margin-bottom:5px; font-size:32px; letter-spacing:2px; color:#00ffcc; text-shadow:0 0 10px rgba(0,255,200,.5); text-align:center; }
        #menu-overlay p { margin-bottom:20px; color:#a0aec0; text-align:center; }
        .shop-container { display:flex; gap:15px; overflow-x:auto; width:100%; max-width:900px; padding:15px 5px; margin-bottom:20px; scrollbar-width:thin; }
        .shop-item { flex:0 0 220px; background:rgba(255,255,255,.05); border:2px solid rgba(255,255,255,.1); border-radius:12px; padding:15px; text-align:center; transition:all .3s ease; display:flex; flex-direction:column; justify-content:space-between; }
        .shop-item.selected { border-color:#00ffcc; background:rgba(0,255,200,.1); box-shadow:0 0 15px rgba(0,255,200,.3); }
        .shop-item h3 { margin:0 0 10px; font-size:18px; }
        .stats-bar { background:rgba(255,255,255,.1); height:6px; border-radius:3px; margin:8px 0; overflow:hidden; text-align:left; }
        .stats-fill { height:100%; background:#00ffcc; }
        .shop-btn { background:#00ffcc; color:#0f2043; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer; margin-top:10px; width:100%; }
        .shop-btn.locked { background:#e53e3e; color:white; } .shop-btn.owned { background:#4a5568; color:#cbd5e0; }
        .mission-selector { width:100%; max-width:500px; background:rgba(0,0,0,.3); padding:10px; border-radius:8px; margin-bottom:25px; border:1px solid rgba(255,255,255,.1); }
        .mission-selector label { display:block; margin-bottom:5px; font-weight:bold; color:#00ffcc; }
        .mission-selector select { width:100%; padding:10px; background:#1a202c; color:white; border:1px solid #4a5568; border-radius:6px; font-size:16px; outline:none; }
        #start-btn { background:linear-gradient(90deg,#00ffcc,#00bfff); color:#0f2043; font-size:22px; font-weight:bold; padding:15px 60px; border:none; border-radius:30px; cursor:pointer; box-shadow:0 4px 15px rgba(0,255,200,.4); transition:transform .2s; }
        #start-btn:active { transform:scale(.95); } #credits-buy-btn { background:#ffd43b;color:#171b20;border:none;padding:10px 18px;border-radius:20px;font-weight:bold;cursor:pointer;margin-bottom:15px; } #crash-msg{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);z-index:30;display:none;text-align:center;color:#fff;font-size:28px;font-weight:bold;background:rgba(130,0,0,.72);padding:18px 28px;border-radius:14px;} #credits-display { font-size:20px; color:#ffff00; font-weight:bold; margin-bottom:15px; background:rgba(0,0,0,.3); padding:5px 15px; border-radius:20px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
<div id="canvas-container"></div>
<div id="hud-top" class="ui-panel">Flugzeug: <span id="hud-plane-name">-</span><br>Credits: <span id="hud-credits" style="color:#ffff00;">0</span><br>Geschwindigkeit: <span id="hud-speed">0</span> km/h (Schub: <span id="hud-throttle">0</span>%)<br>Höhe: <span id="hud-altitude">0</span> m<br><span id="hud-mission-desc" style="color:#00ffcc;font-size:15px;">Mission: Fliege durch den Ring!</span></div>
<div id="hud-center-msg" class="ui-panel">MISSION ERFÜLLT!<br>+50 Credits</div><div id="crash-msg">CRASH!</div>
<div class="touch-container">
<div class="control-group"><div class="throttle-container"><span class="throttle-label">SCHUB</span><button class="btn-touch" id="btn-throttle-up">▲</button><div style="height:10px;"></div><button class="btn-touch" id="btn-throttle-down">▼</button></div><div class="vertical-controls" style="display:flex;flex-direction:row;align-items:center;gap:10px;"><button class="btn-touch" id="btn-roll-left">◀</button><button class="btn-touch" id="btn-roll-right">▶</button></div></div>
<div class="control-group vertical-controls" style="justify-content:center;"><button class="btn-touch" id="btn-pitch-down">▲</button><div style="height:15px;text-align:center;color:rgba(255,255,255,.4);font-size:12px;font-weight:bold;">PITCH</div><button class="btn-touch" id="btn-pitch-up">▼</button></div>
</div>
<div id="menu-overlay"><h1>TURBOPROP FLIGHT SIMULATOR</h1><p>HTML5 Android Prototyp (40 Missionen & 15 Flugzeuge)</p><div id="credits-display">Deine Credits: <span id="menu-credits">0</span> 🪙</div><button id="credits-buy-btn" onclick="openCreditShop()">🪙 CREDITS KAUFEN</button><div class="shop-container" id="shop-list"></div><div class="mission-selector"><label for="mission-select">Mission auswählen (1-20):</label><select id="mission-select"></select></div><button id="start-btn">FLUG STARTEN</button></div>
<script>
let saveState={credits:0,unlockedAircraft:[0],selectedAircraft:0,currentMission:0};
if(localStorage.getItem('turboprop_sim_save')){try{saveState=JSON.parse(localStorage.getItem('turboprop_sim_save'));}catch(e){console.error(e);}}
function saveGame(){localStorage.setItem('turboprop_sim_save',JSON.stringify(saveState));}
const aircraftData=[
{name:"Cessna Trainer",price:0,speedMax:40,handling:1.5,liftFactor:.12,color:0xffffff,desc:"Perfekt für Einsteiger."},
{name:"Twin Turboprop",price:50,speedMax:55,handling:1.1,liftFactor:.15,color:0x3182ce,desc:"Klassisches Regional-Frachtflugzeug."},
{name:"C-130 Hercules",price:120,speedMax:50,handling:.8,liftFactor:.2,color:0x4a5568,desc:"Schweres, vierpropelleriges Militärflugzeug."},
{name:"Water Bomber",price:200,speedMax:52,handling:1,liftFactor:.18,color:0xdd6b20,desc:"Löschflugzeug für Spezialeinsätze."},
{name:"Regional Airliner",price:350,speedMax:65,handling:.9,liftFactor:.16,color:0xe2e8f0,desc:"Ziviles Passagierflugzeug."},
{name:"Military Cargo Jet",price:500,speedMax:75,handling:.7,liftFactor:.22,color:0x2d3748,desc:"Überschall-Frachttransporter."},
{name:"Supersonic Interceptor",price:750,speedMax:110,handling:2,liftFactor:.1,color:0xe53e3e,desc:"Extrem schnell und wendig."},
{name:"Concept VTOL X",price:1000,speedMax:85,handling:1.8,liftFactor:.25,color:0x805ad5,desc:"Zukunftsweisendes Hybridflugzeug."},
{name:"Heavy Cargo Titan",price:1500,speedMax:60,handling:.5,liftFactor:.3,color:0x234e52,desc:"Das größte Flugzeug der Flotte."},
{name:"Stealth Ghost Jet",price:2500,speedMax:120,handling:2.2,liftFactor:.14,color:0x1a202c,desc:"Das ultimative High-End Flugzeug."},
{name:"Airbus A320",price:700,speedMax:82,handling:.85,liftFactor:.17,color:0xdfe6ee,desc:"Moderner Kurz- und Mittelstrecken-Airliner.",type:"airliner"},
{name:"Boeing 747",price:1200,speedMax:78,handling:.58,liftFactor:.28,color:0xf4f4f4,desc:"Legendärer Jumbo-Jet mit vier Triebwerken.",type:"jumbo"},
{name:"Airbus A380",price:2000,speedMax:76,handling:.48,liftFactor:.34,color:0xf1f1f1,desc:"Doppelstöckiger Superjumbo für viele Passagiere.",type:"superjumbo"},
{name:"Rescue Helicopter",price:900,speedMax:48,handling:1.65,liftFactor:.42,color:0xff5a36,desc:"Wendiger Rettungshubschrauber mit Hauptrotor.",type:"helicopter"},
{name:"Recon Drone",price:600,speedMax:60,handling:2.4,liftFactor:.30,color:0x4b5563,desc:"Kleine Aufklärungsdrohne mit vier Rotoren.",type:"drone"}];
const missionData=[];
for(let i=1;i<=40;i++)missionData.push({id:i-1,name:"Mission "+i+": "+(i===1?"Erster Start":i===21?"Neue Region":i<=5?"Höhentraining":i<=10?"Präzisionsflug":i<=20?"Schwerer Navigationskurs":i<=30?"Küstenflug":i<=35?"Gebirgsflug":"Extremes Manöver"),targetPos:{x:Math.sin(i*1.5)*(220+i*55)+(i>20?1800:0),y:40+i*11+Math.cos(i)*20,z:-300-i*170},reward:30+i*20,desc:"Fliege präzise durch den markierten Kontrollring am Himmel."});
let scene,camera,renderer,airplane,propellerLeft,propellerRight,ringTarget,clock=new THREE.Clock();
let physics={speed:0,throttle:0,pitchSpeed:0,rollSpeed:0,yawSpeed:0,altitude:0,velocity:new THREE.Vector3(0,0,0),orientation:new THREE.Quaternion()};
let inputs={pitchUp:false,pitchDown:false,rollLeft:false,rollRight:false,throttleUp:false,throttleDown:false};
const shopListEl=document.getElementById('shop-list'),missionSelectEl=document.getElementById('mission-select'),menuOverlay=document.getElementById('menu-overlay');
function updateUI(){
document.getElementById('menu-credits').innerText=saveState.credits;document.getElementById('hud-credits').innerText=saveState.credits;shopListEl.innerHTML='';
aircraftData.forEach((ac,idx)=>{const u=saveState.unlockedAircraft.includes(idx),s=saveState.selectedAircraft===idx,item=document.createElement('div');item.className="shop-item "+(s?"selected":"");const speedPct=ac.speedMax/120*100,handPct=ac.handling/2.5*100;item.innerHTML='<div><h3>'+ac.name+'</h3><p style="font-size:11px;color:#a0aec0;margin:0 0 10px">'+ac.desc+'</p><div style="font-size:11px;text-align:left">SPEED ('+ac.speedMax*8+' km/h)</div><div class="stats-bar"><div class="stats-fill" style="width:'+speedPct+'%"></div></div><div style="font-size:11px;text-align:left">HANDLING</div><div class="stats-bar"><div class="stats-fill" style="width:'+handPct+'%;background:#00bfff"></div></div></div><div>'+ (u?'<button class="shop-btn '+(s?'':'owned')+'" onclick="selectAircraft('+idx+')">'+(s?'Ausgewählt':'Wählen')+'</button>':'<button class="shop-btn locked" onclick="buyAircraft('+idx+')">Kaufen: '+ac.price+' C</button>')+'</div>';shopListEl.appendChild(item);});
missionSelectEl.innerHTML='';missionSelectEl.previousElementSibling.innerText='Mission auswählen (1-40):';missionData.forEach(m=>{const o=document.createElement('option');o.value=m.id;o.selected=saveState.currentMission===m.id;o.innerText=m.name+' (+'+m.reward+' Credits)';missionSelectEl.appendChild(o);});}
window.selectAircraft=function(idx){if(localAudio){stopLocalAudio();localAudio=null;}saveState.selectedAircraft=idx;saveGame();updateUI();};
const CREDIT_PAYMENT_URL="https://www.paypal.com/donate/?hosted_button_id=HF3HYZ9J3QV4U";
const PAYMENT_API_URL="";
function getPlayerId(){
 let id=localStorage.getItem('turboprop_player_id');
 if(!id){
  id=(crypto.randomUUID?crypto.randomUUID():('p_'+Date.now()+'_'+Math.random().toString(36).slice(2)));
  localStorage.setItem('turboprop_player_id',id);
 }
 return id;
}
async function syncCreditsFromServer(){
 if(!PAYMENT_API_URL)return;
 try{
  const r=await fetch(PAYMENT_API_URL.replace(/\/$/,'')+'/api/balance?player='+encodeURIComponent(getPlayerId()));
  if(!r.ok)return;
  const data=await r.json();
  if(Number.isFinite(data.credits)){
   saveState.credits=Math.max(0,Math.floor(data.credits));
   saveGame();
   updateUI();
  }
 }catch(e){console.warn('Credits-Server nicht erreichbar',e);}
}
function processPayPalReturn(){
 const pendingKey='paypal_pending_purchase';
 let pending=null;
 try{pending=JSON.parse(localStorage.getItem(pendingKey)||'null');}catch(e){pending=null;}
 if(!pending||!Number.isFinite(pending.startedAt)||!Number.isFinite(pending.amount))return;
 const amount=Math.max(0,Math.floor(Number(pending.amount)));
 const elapsed=Date.now()-pending.startedAt;
 const allowed=[500,1200,3000,7500];
 if(!allowed.includes(amount)){
  localStorage.removeItem(pendingKey);
  return;
 }
 if(elapsed<30000){
  localStorage.removeItem(pendingKey);
  history.replaceState({},'',location.pathname);
  alert('Du warst weniger als 30 Sekunden bei PayPal. Es wurden keine Credits gutgeschrieben.');
  return;
 }
 localStorage.removeItem(pendingKey);
 saveState.credits=(saveState.credits||0)+amount;
 saveGame();
 updateUI();
 alert('Du warst '+Math.floor(elapsed/1000)+' Sekunden außerhalb des Spiels. '+amount.toLocaleString('de-AT')+' Credits wurden hinzugefügt.');
 history.replaceState({},'',location.pathname);
}
function openCreditShop(){
 const packages=[{credits:500,price:"2,99 €"},{credits:1200,price:"5,99 €"},{credits:3000,price:"11,99 €"},{credits:7500,price:"24,99 €"}];
 let html='<div style="max-width:420px;background:#172033;color:white;padding:20px;border-radius:14px;box-shadow:0 10px 40px #000;position:fixed;z-index:1000;left:50%;top:50%;transform:translate(-50%,-50%)"><h2>🪙 Credits kaufen</h2><p style="font-size:13px;color:#cbd5e0">Wähle ein Paket. Der Zahlungsvorgang wird über deinen Zahlungsanbieter geöffnet.</p>';
 packages.forEach(p=>html+='<button style="display:block;width:100%;margin:8px 0;padding:12px;border:0;border-radius:8px;background:#ffd43b;font-weight:bold" onclick="startCreditPurchase('+p.credits+')">'+p.credits+' Credits – '+p.price+'</button>');
 html+='<button style="width:100%;padding:9px;border:0;border-radius:8px" onclick="closeCreditShop()">Abbrechen</button></div><div id="credit-shop-backdrop" onclick="closeCreditShop()" style="position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:999"></div>';
 const wrap=document.createElement('div');wrap.id='credit-shop-modal';wrap.innerHTML=html;document.body.appendChild(wrap);
}
function closeCreditShop(){const m=document.getElementById('credit-shop-modal');if(m)m.remove();}
function startCreditPurchase(amount){
 const sep=CREDIT_PAYMENT_URL.includes('?')?'&':'?';
 const purchaseId=(crypto.randomUUID?crypto.randomUUID():('purchase_'+Date.now()+'_'+Math.random().toString(36).slice(2)));
 localStorage.setItem('paypal_pending_purchase',JSON.stringify({id:purchaseId,amount:amount,startedAt:Date.now()}));
 const target=CREDIT_PAYMENT_URL+sep+'credits='+encodeURIComponent(amount);
 window.location.href=target;
}
window.buyAircraft=function(idx){const p=aircraftData[idx].price;if(saveState.credits>=p){saveState.credits-=p;saveState.unlockedAircraft.push(idx);saveState.selectedAircraft=idx;saveGame();updateUI();}else alert("Nicht genug Credits! Fliege erst Missionen, um Credits zu verdienen.");};
function disposeSceneResources(oldScene){
 if(!oldScene)return;
 oldScene.traverse(obj=>{
  if(obj.geometry)obj.geometry.dispose();
  if(obj.material){
   const mats=Array.isArray(obj.material)?obj.material:[obj.material];
   mats.forEach(m=>{
    if(m.map)m.map.dispose();
    if(m.normalMap)m.normalMap.dispose();
    if(m.roughnessMap)m.roughnessMap.dispose();
    if(m.metalnessMap)m.metalnessMap.dispose();
    m.dispose();
   });
  }
 });
 oldScene.clear();
}
function init3D(){
const c=document.getElementById('canvas-container');
if(scene)disposeSceneResources(scene);
scene=new THREE.Scene();scene.background=new THREE.Color(0x87ceeb);scene.fog=new THREE.FogExp2(0x87ceeb,.00055);camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,14000);
if(!renderer){
 renderer=new THREE.WebGLRenderer({antialias:true,depth:true,stencil:false,powerPreference:'high-performance'});
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
 renderer.setSize(innerWidth,innerHeight);
 renderer.shadowMap.enabled=false;
 c.innerHTML='';
 c.appendChild(renderer.domElement);
}else{
 renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,1.5));
 renderer.setSize(innerWidth,innerHeight);
}
scene.add(new THREE.AmbientLight(0xffffff,.6));const sun=new THREE.DirectionalLight(0xfffaed,.8);sun.position.set(500,1000,500);scene.add(sun);
const region=saveState.currentMission>=20?1:0;
const groundColor=region===0?0x557a46:0x8b7650;
const groundSize=region===1?16000:10000;
const ground=new THREE.Mesh(new THREE.PlaneGeometry(groundSize,groundSize,48,48),new THREE.MeshStandardMaterial({color:groundColor,roughness:.9,metalness:.1,flatShading:true}));ground.rotation.x=-Math.PI/2;scene.add(ground);buildScenery(region);
buildAirportExpansion(region);buildSceneryEnhancements(region);
buildRain();
const runway=new THREE.Mesh(new THREE.PlaneGeometry(60,800),new THREE.MeshStandardMaterial({color:0x333333,roughness:.8,polygonOffset:true,polygonOffsetFactor:1,polygonOffsetUnits:1}));runway.rotation.x=-Math.PI/2;runway.position.set(region===1?-850:0,.1,region===1?-1100:-250);scene.add(runway);
const lineGeo=new THREE.PlaneGeometry(2,40),lineMat=new THREE.MeshBasicMaterial({color:0xffffff,polygonOffset:true,polygonOffsetFactor:-2,polygonOffsetUnits:-2});for(let z=-600;z<=100;z+=100){const l=new THREE.Mesh(lineGeo,lineMat);l.rotation.x=-Math.PI/2;l.position.set(region===1?-850:0,.2,region===1?z-850:z);scene.add(l);}
buildAirplaneModel();buildMissionRing();physics.speed=0;physics.throttle=0;
const spawnX=region===1?-850:0,spawnZ=region===1?-1450:-600;
airplane.position.set(spawnX,2,spawnZ);airplane.rotation.set(0,Math.PI,0);camera.position.set(spawnX,6,spawnZ+18);addEventListener('resize',onWindowResize,false);}

function buildSceneryEnhancements(region){
 const cloudMat=new THREE.MeshStandardMaterial({color:0xffffff,roughness:1,transparent:true,opacity:.82,depthWrite:false});
 for(let i=0;i<18;i++){
  const cloud=new THREE.Group();
  for(let p=0;p<4+(i%3);p++){const puff=new THREE.Mesh(new THREE.SphereGeometry(38+(p%3)*14,10,8),cloudMat);puff.scale.y=.42;puff.position.set((p-2)*38,(p%2)*14,(p%3)*24);cloud.add(puff);}
  cloud.position.set((i*733)%7600-3800,360+(i%4)*80,-(i*1193)%7600-350);scene.add(cloud);
 }
 const cityMat=new THREE.MeshStandardMaterial({color:region===1?0xd6c6aa:0x8b98a8,roughness:.9});
 const beaconMat=new THREE.MeshBasicMaterial({color:0xffd84a});
 for(let s=0;s<4;s++){
  const city=new THREE.Group();
  for(let b=0;b<10;b++){const h=18+(b%5)*11;const t=new THREE.Mesh(new THREE.BoxGeometry(22+(b%3)*8,h,22+(b%2)*7),cityMat);t.position.set((b%5)*55-110,h/2,Math.floor(b/5)*55-28);city.add(t);const beacon=new THREE.Mesh(new THREE.SphereGeometry(1.2,6,5),beaconMat);beacon.position.set(t.position.x,h+1,t.position.z);city.add(beacon);}
  city.position.set(-2500+s*1700,0,-900-s*1550);scene.add(city);
 }
}

function buildScenery(region=0){
if(region===1){
 const palmTrunk=new THREE.MeshStandardMaterial({color:0x8b5a2b,roughness:1});
 const palmLeaf=new THREE.MeshStandardMaterial({color:0x176b3a,roughness:1});
 for(let i=0;i<48;i++){
  const px=-3400+(i*257)%6800, pz=-450-(i*389)%7000;
  const palm=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(2.2,3.2,28,7),palmTrunk); trunk.position.y=14; palm.add(trunk);
  for(let j=0;j<7;j++){const leaf=new THREE.Mesh(new THREE.BoxGeometry(2,1,22),palmLeaf);leaf.position.y=29;leaf.rotation.y=j*Math.PI/3.5;leaf.rotation.x=-.35;leaf.position.x=Math.sin(j*Math.PI/3.5)*7;leaf.position.z=Math.cos(j*Math.PI/3.5)*7;palm.add(leaf);}
  palm.position.set(px,0,pz);scene.add(palm);
 }
 const waterMat2=new THREE.MeshStandardMaterial({color:0x1b7892,roughness:.2,metalness:.05,transparent:true,opacity:.95});
 const sandMat=new THREE.MeshStandardMaterial({color:0xc2a66b,roughness:1});
 const rockMat=new THREE.MeshStandardMaterial({color:0x6b6255,roughness:1,flatShading:true});
 const forestMat=new THREE.MeshStandardMaterial({color:0x1f4f38,roughness:1});
 const cliffData=[[-1800,-1200,520,220],[1900,-2200,650,260],[-2200,-3800,780,320],[2400,-5200,850,360],[-1200,-6800,900,380],[3000,-7200,700,300]];

function addWingShape(span,rootChord,tipChord,sweep,thickness,material,y=.05){
 const sh=new THREE.Shape();
 sh.moveTo(-span*.08,-rootChord*.52);sh.lineTo(-span,-rootChord*.52+sweep);
 sh.lineTo(-span,-rootChord*.52+sweep+tipChord);sh.lineTo(-span*.08,rootChord*.48);

 sh.lineTo(span,-rootChord*.52+sweep);sh.lineTo(span*.08,-rootChord*.52);sh.lineTo(-span*.08,-rootChord*.52);
 const geo=new THREE.ExtrudeGeometry(sh,{depth:thickness,bevelEnabled:true,bevelSegments:1,steps:1,bevelSize:.04,bevelThickness:.03});
 geo.rotateX(Math.PI/2);
 const mesh=new THREE.Mesh(geo,material);mesh.position.y=y;airplane.add(mesh);return mesh;
}

function updateFlightPhysics(delta){
if(crashState.active){updateCrash(delta);return;}
if(!airplane)return;
const ac=aircraftData[saveState.selectedAircraft];
const dt=Math.min(delta,.035);
const handlingFactor=ac.handling;

// Schub: weichere Beschleunigung und natürliche Trägheit
if(inputs.throttleUp)physics.throttle=Math.min(100,physics.throttle+dt*32);
if(inputs.throttleDown)physics.throttle=Math.max(0,physics.throttle-dt*32);
document.getElementById('hud-throttle').innerText=Math.round(physics.throttle);

if(propellerLeft&&propellerRight){
 const rs=(physics.throttle/100)*2.2+.08;
 propellerLeft.rotation.z+=rs;
 propellerRight.rotation.z-=rs;
}
if(airplane.userData.rotor)airplane.userData.rotor.rotation.y+=dt*(8+physics.throttle*.08);
if(airplane.userData.tailRotor)airplane.userData.tailRotor.rotation.x+=dt*(12+physics.throttle*.1);
if(airplane.userData.rotors)airplane.userData.rotors.forEach((r,i)=>r.rotation.y+=dt*(12+(i%2)*2+physics.throttle*.1));
if(airplane.userData.mixer)airplane.userData.mixer.update(dt);

// Zielgeschwindigkeit mit Luftwiderstand statt sofortiger Geschwindigkeitsänderung
const forwardVector=new THREE.Vector3(0,0,-1).applyQuaternion(airplane.quaternion);
const climbPenalty=Math.max(-1,Math.min(1,forwardVector.y))*10;
const throttleSpeed=(physics.throttle/100)*ac.speedMax;
const drag=physics.speed*physics.speed*.008;
let targetSpeed=Math.max(0,throttleSpeed-climbPenalty-drag);
const acceleration=(targetSpeed-physics.speed)*(1.0+handlingFactor*.12);
physics.speed+=acceleration*dt;
physics.speed=Math.max(0,Math.min(ac.speedMax*1.08,physics.speed));

// Steuerung mit Trägheit
const pitchInput=(inputs.pitchUp?1:0)-(inputs.pitchDown?1:0);
const rollInput=(inputs.rollLeft?1:0)-(inputs.rollRight?1:0);
const pitchAuthority=Math.min(1,physics.speed/18);
const stallFactor=physics.speed<12?Math.max(.25,physics.speed/12):1;

if(pitchInput!==0){
 physics.pitchSpeed+=pitchInput*dt*2.8*handlingFactor*pitchAuthority;
}else{
 physics.pitchSpeed*=Math.pow(.16,dt);
}
physics.pitchSpeed=Math.max(-.75,Math.min(.75,physics.pitchSpeed));
physics.pitchSpeed*=stallFactor;

if(rollInput!==0){
 physics.rollSpeed+=rollInput*dt*3.8*handlingFactor*pitchAuthority;
}else{
 physics.rollSpeed*=Math.pow(.08,dt);
}
physics.rollSpeed=Math.max(-1.15,Math.min(1.15,physics.rollSpeed));
physics.rollSpeed*=stallFactor;

airplane.rotateX(physics.pitchSpeed*dt);
airplane.rotateZ(physics.rollSpeed*dt);

// Banked turn: stärkeres Rollen erzeugt eine sanfte Gierbewegung
const euler=new THREE.Euler().setFromQuaternion(airplane.quaternion,'YXZ');
const rollAngle=euler.z;
const bankTurn=Math.sin(Math.max(-1.2,Math.min(1.2,rollAngle)))*.65*handlingFactor;
airplane.rotateY(bankTurn*dt);

// Auftrieb hängt von Geschwindigkeit und Anstellwinkel ab.
// Bei zu geringer Geschwindigkeit entsteht ein leichter Stall-Effekt.
const speedRatio=Math.min(1.4,physics.speed/28);
const pitchLift=Math.max(-.7,Math.min(1.1,forwardVector.y*.8));
const lift=(speedRatio*speedRatio)*ac.liftFactor*2.2*(1-Math.min(.7,Math.abs(rollAngle)*.28));
const gravity=.34;
let verticalAcceleration=lift-gravity+pitchLift*.16;

// Bodenwirkung: sanftes Abfangen und Rollen statt Durchdringen des Bodens
if(airplane.position.y<=1.2){
 airplane.position.y=1.2;
 if(verticalAcceleration<0)verticalAcceleration=0;
 if(physics.speed<12){
  physics.speed=Math.max(0,physics.speed-dt*(physics.throttle<5?8:2));
  airplane.rotation.x*=Math.pow(.12,dt);
  airplane.rotation.z*=Math.pow(.12,dt);
 }
}

// Geschwindigkeit in Flugrichtung + vertikale Physik
const localVelocity=new THREE.Vector3(0,0,-physics.speed).applyQuaternion(airplane.quaternion);
airplane.position.x+=localVelocity.x*dt*7.5;
airplane.position.z+=localVelocity.z*dt*7.5;
airplane.position.y+=(localVelocity.y+verticalAcceleration)*dt*7.5;

if(airplane.position.y<1.2){
 airplane.position.y=1.2;
 if(physics.speed>22&&forwardVector.y<-.12)triggerCrash("Harter Aufprall");
}

document.getElementById('hud-speed').innerText=Math.round(physics.speed*8);
document.getElementById('hud-altitude').innerText=Math.max(0,Math.round((airplane.position.y-1.2)*5));
if(ringTarget)ringTarget.rotation.y+=dt*.5;

const offset=new THREE.Vector3(0,4.2,16).applyQuaternion(airplane.quaternion);
const targetCamPos=airplane.position.clone().add(offset);
camera.position.lerp(targetCamPos,.085);
camera.lookAt(airplane.position.clone().add(new THREE.Vector3(0,.5,-2).applyQuaternion(airplane.quaternion)));
checkMissionCollision();}

 localAudio.propeller.volume=Math.min(.55,profile[1]+throttle*.12);
 localAudio.propeller.playbackRate=Math.min(1.85,profile[0]+throttle*.42+Math.min(speed/140,1)*.08);
 if(airplane.userData.aircraftType==="prop"&&localAudio.propeller.paused&&throttle>.03)localAudio.propeller.play().catch(()=>{});
 updateEngineAudio();
}let gameRunning=false;function animate(){if(!gameRunning)return;requestAnimationFrame(animate);const delta=clock.getDelta();updateFlightPhysics(delta);updateRain(delta);updateLocalAudio();renderer.render(scene,camera);}
addEventListener('keydown',e=>{if(!gameRunning)return;switch(e.key.toLowerCase()){case'w':case'arrowup':inputs.pitchUp=true;break;case's':case'arrowdown':inputs.pitchDown=true;break;case'a':case'arrowleft':inputs.rollLeft=true;break;case'd':case'arrowright':inputs.rollRight=true;break;case'r':inputs.throttleUp=true;setThrottleSound(true);break;case'f':inputs.throttleDown=true;break;case'escape':gameRunning=false;stopLocalAudio();menuOverlay.style.display='flex';updateUI();break;}});
addEventListener('keyup',e=>{switch(e.key.toLowerCase()){case'w':case'arrowup':inputs.pitchUp=false;break;case's':case'arrowdown':inputs.pitchDown=false;break;case'a':case'arrowleft':inputs.rollLeft=false;break;case'd':case'arrowright':inputs.rollRight=false;break;case'r':inputs.throttleUp=false;setThrottleSound(false);break;case'f':inputs.throttleDown=false;break;}});
function setThrottleSound(on){
 if(!localAudio||!localAudio.propeller)return;
 if(on){
  localAudio.propeller.currentTime=0;
  localAudio.propeller.play().catch(()=>{});
 }else{
  localAudio.propeller.pause();
  localAudio.propeller.currentTime=0;
 }
}
function bindTouchBtn(id,p){
 const btn=document.getElementById(id);if(!btn)return;
 const start=e=>{e.preventDefault();inputs[p]=true;if(p==='throttleUp')setThrottleSound(true);};
 const end=e=>{e.preventDefault();inputs[p]=false;if(p==='throttleUp')setThrottleSound(false);};
 btn.addEventListener('touchstart',start,{passive:false});
 btn.addEventListener('touchend',end,{passive:false});
 btn.addEventListener('touchcancel',end,{passive:false});
 btn.addEventListener('mousedown',()=>{inputs[p]=true;if(p==='throttleUp')setThrottleSound(true);});
 btn.addEventListener('mouseup',()=>{inputs[p]=false;if(p==='throttleUp')setThrottleSound(false);});
 btn.addEventListener('mouseleave',()=>{inputs[p]=false;if(p==='throttleUp')setThrottleSound(false);});
}
bindTouchBtn('btn-throttle-up','throttleUp');bindTouchBtn('btn-throttle-down','throttleDown');bindTouchBtn('btn-roll-left','rollLeft');bindTouchBtn('btn-roll-right','rollRight');bindTouchBtn('btn-pitch-up','pitchUp');bindTouchBtn('btn-pitch-down','pitchDown');
document.getElementById('start-btn').addEventListener('click',()=>{saveState.currentMission=parseInt(missionSelectEl.value);saveGame();menuOverlay.style.display='none';gameRunning=true;init3D();clock.getDelta();startLocalAudio();animate();});updateUI();
processPayPalReturn();
window.addEventListener('pageshow',function(){processPayPalReturn();});
syncCreditsFromServer();
</script>
